name: repo-state-verifier

on:
  workflow_run:
    workflows: ["data-plane-ci"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect exact GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: python scripts/verify_repo_state.py
      - name: Upload machine-readable state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-state-${{ github.run_id }}
          path: repo-state.json
          if-no-files-found: error