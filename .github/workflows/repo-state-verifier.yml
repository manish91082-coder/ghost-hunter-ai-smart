name: repo-state-verifier

on:
  workflow_run:
    workflows: ["data-plane-ci"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact repository state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: data-plane-ci
        run: python scripts/verify_repo_state.py
      - name: Upload machine-readable state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-state-${{ github.event.workflow_run.id }}
          path: repo-state.json
          if-no-files-found: error
