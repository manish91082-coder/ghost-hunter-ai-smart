[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-hunter-ai-smart"
version = "0.1.0"
description = "Zero-cost-first Polygon dynamic arbitrage intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=12,<16",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
